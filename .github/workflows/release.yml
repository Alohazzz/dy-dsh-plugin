name: Release DSH plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}
concurrency:
  group: dsh-plugin-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build release package
        id: package
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          npm pack --pack-destination "$RUNNER_TEMP"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tarball=$RUNNER_TEMP/dy-dsh-plugin-$version.tgz" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ steps.package.outputs.tarball }}
      - name: Publish to npm
        env:
          VERSION: ${{ steps.package.outputs.version }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          if integrity=$(npm view "dy-dsh-plugin@$VERSION" dist.integrity --registry https://registry.npmjs.org) && [[ -n "$integrity" ]]; then
            actual="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
            if [[ "$actual" != "$integrity" ]]; then
              echo "::error::Published npm package differs from this release archive"
              exit 1
            fi
            echo "Matching package already published"
          else
            npm publish "$TARBALL" --access public --registry https://registry.npmjs.org
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$TARBALL" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$TARBALL" --verify-tag --generate-notes
          fi

  index:
    needs: release
    if: always() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate plugin index
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if node scripts/plugin-index.mjs site/index.json "$VERSION"; then
              exit 0
            fi
            if [[ -z "$VERSION" || "$attempt" == 12 ]]; then
              exit 1
            fi
            sleep 25
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
